<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イナズマ必殺技メーカー｜非公式ファン制作</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#fff;background:#102342}*{box-sizing:border-box}body{margin:0;background:#102342}main{max-width:940px;margin:auto;padding:30px 16px 55px}header{text-align:center}h1{color:#FFD700;font-family:'Yu Gothic',sans-serif;font-weight:900;font-size:clamp(26px,5vw,46px);margin:10px 0}p,.muted{color:#b9cbe7}.panel{background:#122747;border:1px solid #36587f;border-radius:20px;padding:22px;margin:20px 0}.filters,.buttons,.series{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.series{margin:12px 0}.series label{display:inline-flex;gap:5px;align-items:center;background:#071c35;border:1px solid #6483a6;border-radius:9px;padding:8px 11px;cursor:pointer}.series label:has(input:checked){background:#274b72;border-color:#ffbf53}.series input{accent-color:#ffb83c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{min-width:0}label.heading{display:block;font-weight:800;margin-bottom:8px}input[type=search],select{width:100%;background:#071c35;color:#fff;border:1px solid #6483a6;border-radius:9px;padding:12px;font:inherit}select{height:190px}select option{padding:6px}button{font:inherit;font-weight:800;background:linear-gradient(#ffda66,#ff9c24);color:#14213d;border:0;border-radius:11px;padding:11px 17px;cursor:pointer}button.secondary{background:#2b4c75;color:#fff;border:1px solid #6385ae}button:disabled{opacity:.45;cursor:not-allowed}.buttons{justify-content:center;margin:12px 0}.result{text-align:center;color:#ffdd72;font-weight:900;font-size:clamp(25px,5vw,42px);min-height:65px;overflow-wrap:anywhere;margin:12px 0}.hint{font-size:13px;color:#b9cbe7;margin:8px 0}ul{padding-left:22px}li{padding:6px 0;border-bottom:1px solid #34516d;overflow-wrap:anywhere}input[type=file]{max-width:100%}@media(max-width:560px){.panel{padding:14px}.grid{grid-template-columns:1fr}select{height:145px}}
</style></head><body><main><header><h1>イナズマ必殺技メーカー</h1><p>前半と後半を自分で選んで、オリジナル必殺技を作ろう！</p></header><section class="panel"><strong>作品フィルター（複数選択可）</strong><div class="buttons"><button type="button" class="secondary" id="all">すべてチェック</button><button type="button" class="secondary" id="none">すべて外す</button></div><div id="series" class="series"></div><div class="hint" id="stats"></div></section><section class="panel"><div class="grid"><div class="field"><label class="heading" for="searchA">前半の言葉</label><input id="searchA" type="search" placeholder="前半を検索"><div class="hint" id="countA"></div><select id="partA" size="7" aria-label="前半の候補"></select></div><div class="field"><label class="heading" for="searchB">後半の言葉</label><input id="searchB" type="search" placeholder="後半を検索"><div class="hint" id="countB"></div><select id="partB" size="7" aria-label="後半の候補"></select></div></div><p style="text-align:center">完成した必殺技</p><div class="result" id="result">？？？</div><div class="buttons"><button id="copy" class="secondary">名前をコピー</button><button id="share" class="secondary">Xでポストする</button><button id="save">履歴に追加</button></div></section><section class="panel"><h2>作成履歴</h2><ul id="history"><li>まだ作成されていません</li></ul><button id="clear" class="secondary">履歴を消す</button></section><section class="panel"><h2>データの読み込み</h2><p class="hint" id="version"></p><p class="hint">公開中のルーレット版と同じ <code>moves.csv</code> を自動で読み込みます。オフラインで試す場合は、下からCSVを選択できます。</p><input id="file" type="file" accept=".csv,text/csv"><p class="hint" id="fileMsg"></p></section><p class="hint">本サイトは非公式のファン制作物であり、LEVEL5および権利者とは関係ありません。</p></main><script>
const STARTER_CSV="元の技名,前半,後半,シリーズ\r\nファイアトルネード,ファイア,トルネード,無印\r\nゴッドハンド,ゴッド,ハンド,無印\r\nエターナルブリザード,エターナル,ブリザード,無印\r\nドラゴンクラッシュ,ドラゴン,クラッシュ,無印\r\nドラゴントルネード,ドラゴン,トルネード,無印\r\nダークトルネード,ダーク,トルネード,無印\r\nデスゾーン,デス,ゾーン,無印\r\nデスゾーン2,デス,ゾーン2,無印\r\nゴッドノウズ,ゴッド,ノウズ,無印\r\nゴッドブレイク,ゴッド,ブレイク,無印\r\nグランフェンリル,グラン,フェンリル,無印\r\nウルフレジェンド,ウルフ,レジェンド,無印\r\nマジン・ザ・ハンド,マジン・ザ・,ハンド,無印\r\nマッハウィンド,マッハ,ウィンド,GO\r\nホワイトハリケーン,ホワイト,ハリケーン,GO\r\nデスソード,デス,ソード,GO\r\nファイアトルネードDD,ファイア,トルネードDD,GO\r\nグレートマックスなオレ,グレート,マックスなオレ,GO\r\nゴッドハンドV,ゴッド,ハンドV,GO\r\nファイアトルネードTC,ファイア,トルネードTC,GO\r\nシャイニングバード,シャイニング,バード,アレス\r\nファイアレモネード,ファイア,レモネード,アレス\r\nラストリゾート,ラスト,リゾート,オリオン\r\n";
const $=id=>document.getElementById(id);
let data=[],selectedSeries=new Set(),chosen=['',''],history=[];
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));out.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field.replace(/\r$/,''));out.push(row)}if(out.length&&out[0][0].replace(/^\uFEFF/,'')==='元の技名')out.shift();return out.map(r=>r.slice(0,4).map(x=>x.trim())).filter(r=>r.length===4&&r.every(x=>x&&x.length<=80))}
function loadCSV(text,label){const rows=parseCSV(text);if(!rows.length)throw Error('有効な技データがありません');const oldSeries=new Set(data.map(r=>r[3]));const previouslyAll=oldSeries.size===0||[...oldSeries].every(s=>selectedSeries.has(s));data=rows;const series=[...new Set(data.map(r=>r[3]))].sort();selectedSeries=new Set(series.filter(s=>previouslyAll||!oldSeries.has(s)||selectedSeries.has(s)));drawSeries();update();$('version').textContent=`${label}：${data.length}件の技を読み込みました`}
function drawSeries(){const host=$('series');host.replaceChildren();for(const name of [...new Set(data.map(r=>r[3]))].sort()){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=selectedSeries.has(name);input.addEventListener('change',()=>{input.checked?selectedSeries.add(name):selectedSeries.delete(name);update()});label.append(input,document.createTextNode(name));host.append(label)}}
function filteredParts(index){return [...new Set(data.filter(r=>selectedSeries.has(r[3])).map(r=>r[index+1]))].sort((a,b)=>a.localeCompare(b,'ja'))}
function update(){const filtered=data.filter(r=>selectedSeries.has(r[3]));$('stats').textContent=`選択中 ${selectedSeries.size}シリーズ ／ 登録技 ${filtered.length}件（全登録 ${data.length}件）`;for(let i=0;i<2;i++){const el=$(i?'partB':'partA'),search=$(i?'searchB':'searchA').value.trim().toLocaleLowerCase(),all=filteredParts(i),parts=all.filter(x=>x.toLocaleLowerCase().includes(search));const old=chosen[i];el.replaceChildren(...parts.map(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;return o}));if(parts.includes(old)){el.value=old}else if(parts.length){el.value=parts[0];chosen[i]=parts[0]}else{chosen[i]=''}$(i?'countB':'countA').textContent=`${parts.length}候補（検索前 ${all.length}候補）`}$('result').textContent=chosen.every(Boolean)?chosen.join(''):'？？？';$('copy').disabled=$('share').disabled=$('save').disabled=!chosen.every(Boolean)}
$('searchA').addEventListener('input',update);$('searchB').addEventListener('input',update);$('partA').addEventListener('change',()=>{chosen[0]=$('partA').value;update()});$('partB').addEventListener('change',()=>{chosen[1]=$('partB').value;update()});$('all').onclick=()=>{selectedSeries=new Set(data.map(r=>r[3]));drawSeries();update()};$('none').onclick=()=>{selectedSeries.clear();drawSeries();update()};$('copy').onclick=async()=>{const name=chosen.join('');if(!chosen.every(Boolean))return;try{await navigator.clipboard.writeText(name);alert('コピーしました')}catch{prompt('必殺技名をコピーしてください',name)}};$('share').onclick=()=>{if(!chosen.every(Boolean))return;const text=`オリジナル必殺技「${chosen.join('')}」を自作したよ！⚡\n\n#イナズマ必殺技メーカー`;const url='https://sorayoooo.github.io/inazuma-slot/';window.open('https://twitter.com/intent/tweet?'+new URLSearchParams({text,url}).toString(),'_blank','noopener,noreferrer')};$('save').onclick=()=>{if(!chosen.every(Boolean))return;history.unshift(chosen.join(''));history=history.slice(0,30);drawHistory()};$('clear').onclick=()=>{history=[];drawHistory()};function drawHistory(){$('history').replaceChildren(...(history.length?history:['まだ作成されていません']).map(x=>{const li=document.createElement('li');li.textContent=x;return li}))}$('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{loadCSV(await file.text(),file.name);$('fileMsg').textContent='CSVを読み込みました'}catch(err){$('fileMsg').textContent='読み込み失敗：'+err.message}});loadCSV(STARTER_CSV,'内蔵サンプル');fetch('https://sorayoooo.github.io/inazuma-slot/moves.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(t=>loadCSV(t,'ルーレット版の共通データ')).catch(e=>{$('version').textContent+=' ／ 共通CSV未取得：'+e.message});
</script></body></html>
